[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "modechoice"
version = "0.1.0"
description = "Transparent MNL mode-share prediction and sensitivity toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Daud Nabi Hridoy" }]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10"]

[project.optional-dependencies]
app = ["streamlit>=1.30", "altair>=5.0"]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["modechoice"]
